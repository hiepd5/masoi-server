services:
  - type: web
    name: masoi-server
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: VOICESTUDIO_URL
        sync: false
      - key: VOICESTUDIO_VOICE_ID
        value: b5d182f3
      - key: VOICESTUDIO_SHARED_SECRET
        sync: false
      - key: ADMIN_STATS_TOKEN
        sync: false
